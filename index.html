<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Te quiero mucho💗</title>

<style>

/* ===== RESPONSIVE PARA CELULARES ===== */

@media(max-width:768px){

    body{

        padding:20px;

        overflow:auto;
    }

    .carta{

        width:100%;

        max-width:95%;

        padding:30px 20px;

        border-radius:20px;
    }

    .carta h1{

        font-size:35px;

        line-height:1.3;
    }

    .carta p{

        font-size:18px;

        line-height:1.8;
    }

    .frase{

        font-size:22px;
    }

    audio{

        width:100%;

        margin-bottom:20px;
    }
}
/* ===== ESTILO GENERAL ===== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#5a189a,#7b2cbf,#9d4edd);
}

/* ===== CORAZONES ===== */

.corazon{
    position:absolute;
    color:#fff;
    animation:subir linear infinite;
}

@keyframes subir{

    0%{
        transform:translateY(100vh) scale(0);
        opacity:0;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:translateY(-10vh) scale(1.5);
        opacity:0;
    }
}

/* ===== CONTENEDOR ===== */

.container{
    position:relative;
    width:350px;
    height:250px;
}

/* ===== SOBRE ===== */

.sobre{
    position:absolute;
    width:100%;
    height:100%;
    background:#c77dff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

/* ===== TAPA ===== */

.tapa{
    position:absolute;
    width:100%;
    height:100%;
    background:#7b2cbf;

    clip-path:polygon(0 0,100% 0,50% 50%);

    transform-origin:top;

    transition:1.5s;

    z-index:5;
}

/* ===== CARTA ===== */

.carta{
    position:absolute;

    width:90%;
    height:90%;

    background:white;

    left:5%;
    top:100%;

    border-radius:15px;

    padding:25px;

    text-align:center;

    transition:2s;

    z-index:2;
}

.carta h1{
    color:#7b2cbf;
    margin-bottom:15px;
}

.carta p{
    color:#444;
    line-height:1.7;
    margin-bottom:10px;
}

/* ===== BOTONES ===== */

button{
    margin-top:15px;

    padding:10px 20px;

    border:none;

    border-radius:10px;

    background:#7b2cbf;

    color:white;

    cursor:pointer;

    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* ===== BOTÓN ABRIR CARTA ===== */

.abrir-btn{

    position:absolute;

    top:50%;

    left:50%;

    transform:translate(-50%,-50%);

    z-index:10;

    padding:14px 28px;

    border:none;

    border-radius:15px;

    background:white;

    color:#7b2cbf;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:0 5px 15px rgba(0,0,0,0.2);

    transition:0.3s;
}

.abrir-btn:hover{

    transform:translate(-50%,-50%) scale(1.05);
}

/* ===== ABRIR SOBRE ===== */

.container.abierto .tapa{
    transform:rotateX(180deg);
}

.container.abierto .carta{
    top:5%;
}

/* ===== MENSAJE ===== */

#mensaje{
    display:none;
    margin-top:15px;
    color:#7b2cbf;
    font-weight:bold;
}

</style>
</head>

<body>

<!-- ===== MÚSICA ===== -->



<!-- ===== SOBRE ===== -->

<div class="container">

    <div class="sobre">

        <!-- BOTÓN ABRIR -->

        <button class="abrir-btn" onclick="abrirCarta()">
            Abrir Carta 💜
        </button>

        <div class="tapa"></div>

        <div class="carta">

            <h1>Para Mi ARMY Favorita 💗</h1>

            <p>
                Si pudiera pasar aunque sea
                <b>Just One Day</b> contigo,
                sería el día más bonito ✨
            </p>

            <p>
                Gracias por hacerme feliz,
                por acompañarme
                y por existir 💗
            </p>

            <button onclick="mostrarMensaje()">
                Abrir Mensaje 💌
            </button>

            <div id="mensaje">
                Eres mi canción favorita todos los días 💗
            </div>

        </div>

    </div>

</div>

<!-- ===== JAVASCRIPT ===== -->

<script>

/* ===== CORAZONES ===== */

for(let i=0;i<40;i++){

    let heart=document.createElement("div");

    heart.classList.add("corazon");

    heart.innerHTML="💜";

    heart.style.left=Math.random()*100+"vw";

    heart.style.fontSize=(Math.random()*20+10)+"px";

    heart.style.animationDuration=(Math.random()*4+3)+"s";

    document.body.appendChild(heart);
}

/* ===== MOSTRAR MENSAJE ===== */

function mostrarMensaje(){

    document.getElementById("mensaje").style.display="block";
}

function abrirCarta(){

    window.location.href="jess.html";
}

</script>

</body>
</html>
